name: Build ForgeStack JAR
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Build plugin
        run: gradle --no-daemon clean jar
      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: ForgeStack-1.0.0
          path: build/libs/ForgeStack-1.0.0.jar
          if-no-files-found: error
